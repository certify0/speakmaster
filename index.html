<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>SpeakMaster</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-1:#0d1a2b;
    --bg-2:#1c3660;
    --ivory:#f4f2ea;
    --ivory-dim:rgba(244,242,234,0.62);
    --amber:#ffb648;
    --amber-dim:rgba(255,182,72,0.16);
    --mint:#63e6c0;
    --mint-dim:rgba(99,230,192,0.16);
    --line:rgba(244,242,234,0.22);
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    padding:0;
    height:100%;
  }

  body{
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    background:
      radial-gradient(ellipse at 50% -10%, rgba(255,182,72,0.10), transparent 55%),
      linear-gradient(160deg, var(--bg-1) 0%, var(--bg-2) 100%);
    color:var(--ivory);
    font-family:'Noto Sans KR', sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
    padding:32px 24px;
  }

  .stage{
    width:100%;
    max-width:360px;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
  }

  /* --- 웨이브 마크 --- */
  .wave{
    display:flex;
    align-items:flex-end;
    gap:5px;
    height:44px;
    margin-bottom:22px;
  }

  .wave span{
    display:block;
    width:5px;
    border-radius:3px;
    background:var(--amber);
    animation:pulse 1.8s ease-in-out infinite;
  }

  .wave span:nth-child(1){height:16px; animation-delay:0s;}
  .wave span:nth-child(2){height:32px; animation-delay:0.12s;}
  .wave span:nth-child(3){height:44px; animation-delay:0.24s;}
  .wave span:nth-child(4){height:24px; animation-delay:0.36s;}
  .wave span:nth-child(5){height:38px; animation-delay:0.48s;}
  .wave span:nth-child(6){height:14px; animation-delay:0.6s;}

  @keyframes pulse{
    0%, 100%{ transform:scaleY(0.55); opacity:0.75; }
    50%{ transform:scaleY(1); opacity:1; }
  }

  @media (prefers-reduced-motion: reduce){
    .wave span{ animation:none; transform:scaleY(0.85); }
  }

  /* --- 워드마크 --- */
  .wordmark{
    font-family:'Sora', sans-serif;
    font-weight:700;
    font-size:26px;
    letter-spacing:0.01em;
    color:var(--ivory);
    margin:0;
  }

  .wordmark em{
    font-style:normal;
    color:var(--amber);
  }

  .tagline{
    margin:10px 0 40px;
    font-size:14px;
    line-height:1.6;
    color:var(--ivory-dim);
    font-weight:400;
  }

  /* --- 버튼 --- */
  .actions{
    width:100%;
    display:flex;
    flex-direction:column;
    gap:14px;
  }

  .btn{
    -webkit-tap-highlight-color:transparent;
    display:flex;
    align-items:center;
    justify-content:center;
    width:100%;
    min-height:56px;
    padding:14px 28px;
    border-radius:999px;
    font-family:'Noto Sans KR', sans-serif;
    font-size:16px;
    font-weight:700;
    text-decoration:none;
    letter-spacing:0.01em;
    transition:transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
  }

  .btn:active{
    transform:scale(0.97);
  }

  .btn-primary{
    background:var(--amber);
    color:#1a1206;
    box-shadow:0 10px 26px -10px rgba(255,182,72,0.55);
  }

  .btn-primary:hover{
    box-shadow:0 12px 30px -8px rgba(255,182,72,0.7);
  }

  .btn-secondary{
    background:var(--amber-dim);
    color:var(--ivory);
    border:1px solid var(--line);
  }

  .btn-secondary:hover{
    background:rgba(255,182,72,0.24);
    border-color:rgba(255,182,72,0.45);
  }

  .btn-tertiary{
    background:var(--mint-dim);
    color:var(--ivory);
    border:1px solid rgba(99,230,192,0.4);
  }

  .btn-tertiary:hover{
    background:rgba(99,230,192,0.26);
    border-color:rgba(99,230,192,0.6);
  }

  .btn:focus-visible{
    outline:2px solid var(--amber);
    outline-offset:3px;
  }

  footer{
    margin-top:48px;
    font-size:11px;
    color:rgba(244,242,234,0.38);
    letter-spacing:0.02em;
  }
</style>
</head>
<body>

  <div class="stage">

    <div class="wave" aria-hidden="true">
      <span></span><span></span><span></span><span></span><span></span><span></span>
    </div>

    <p class="wordmark">Speak<em>Master</em></p>
    <p class="tagline">AI와 함께하는 영어 말하기</p>

    <div class="actions">
      <a class="btn btn-primary" href="https://speakmaster.co.kr/" target="_blank" rel="noopener">스픽마스터 홈페이지</a>
      <a class="btn btn-secondary" href="https://qa-test-accounts.web.app/" target="_blank" rel="noopener">스픽마스터 체험 계정 신청</a>
      <a class="btn btn-tertiary" href="https://docs.google.com/forms/d/e/1FAIpQLSe3ckelVoJbBgNuJysGYX532t6clh1ycgY5vu64msfyHBSAWg/viewform?usp=sharing&ouid=107375793916467323351" target="_blank" rel="noopener">스픽마스터 문의하기</a>
    </div>

    <footer>ⓒ 2026 EDUTEM. All rights reserved.</footer>

  </div>

</body>
</html>
